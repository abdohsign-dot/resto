<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Restaurant Orders</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='85'>🍽️</text></svg>">
<style>
/* ---------- base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0b1220; --panel: #121b2d; --panel2: #1a2540; --line: #263352;
  --tx: #e7edf7; --tx2: #93a2bd; --acc: #3b82f6; --acc2: #2563eb;
  --sent: #f59e0b; --prep: #8b5cf6; --ready: #22c55e; --served: #64748b; --cancel: #ef4444;
}
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--tx);
  font: 15px/1.45 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100%; }
body { touch-action: manipulation; }
[dir="rtl"] body { direction: rtl; }
[dir="rtl"] .topbar, [dir="rtl"] .tb-left, [dir="rtl"] .tb-right,
[dir="rtl"] .thead, [dir="rtl"] .khead, [dir="rtl"] .row { direction: rtl; }
[dir="rtl"] .mitem { direction: rtl; text-align: right; }
[dir="rtl"] input, [dir="rtl"] select, [dir="rtl"] textarea { direction: rtl; text-align: right; }
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font: inherit; }
.hidden { display: none !important; }
.dim { color: var(--tx2); }
.pad { padding: 14px; max-width: 1280px; margin: 0 auto; }

/* ---------- connection bar / toast ---------- */
.connbar { position: sticky; top: 0; z-index: 50; background: #7f1d1d; color: #fff;
  text-align: center; padding: 7px 10px; font-size: 13.5px; }
#toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px);
  background: #e2e8f0; color: #0b1220; padding: 11px 20px; border-radius: 12px; font-weight: 600;
  font-size: 15px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 120;
  max-width: 86vw; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- buttons / chips / inputs ---------- */
.btn { background: var(--panel2); border: 1px solid var(--line); color: var(--tx);
  padding: 10px 16px; border-radius: 12px; font-weight: 600; min-height: 44px; }
.btn:active { filter: brightness(1.25); }
.btn.primary { background: var(--acc2); border-color: transparent; }
.btn.green { background: #15803d; border-color: transparent; }
.btn.amber { background: #b45309; border-color: transparent; }
.btn.violet { background: #6d28d9; border-color: transparent; }
.btn.danger { background: #b91c1c; border-color: transparent; }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 13.5px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12.5px;
  font-weight: 700; color: #0b1220; }
.chip.sent { background: var(--sent); } .chip.preparing { background: var(--prep); color: #fff; }
.chip.ready { background: var(--ready); } .chip.served { background: var(--served); color: #fff; }
.chip.cancelled { background: var(--cancel); color: #fff; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--ready); }
.dot.off { background: var(--cancel); }
.in { width: 100%; background: #0d1526; border: 1px solid var(--line); color: var(--tx);
  padding: 11px 12px; border-radius: 11px; font-size: 15.5px; outline: none; }
.in:focus { border-color: var(--acc); }
label.f { display: block; margin: 12px 0 4px; color: var(--tx2); font-size: 13.5px; font-weight: 600; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center;
  justify-content: space-between; gap: 10px; padding: 10px 14px; background: rgba(11,18,32,.92);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); min-height: 58px; }
.tb-left, .tb-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tb-title { font-size: 19px; font-weight: 800; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.tb-sub { color: var(--tx2); font-size: 13.5px; white-space: nowrap; }

/* ---------- role select ---------- */
.role-wrap { min-height: calc(100vh - 40px); display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px; text-align: center; }
.brand { color: var(--tx2); font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  font-size: 13px; margin-bottom: 10px; }
.role-wrap h1 { font-size: clamp(22px, 4.5vw, 34px); margin: 0 0 30px; }
.roles { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
.role { display: flex; flex-direction: column; align-items: center; gap: 10px;
  width: min(210px, 42vw); padding: 26px 14px; border-radius: 20px; background: var(--panel);
  border: 1px solid var(--line); font-size: 19px; font-weight: 700; }
.role:active { border-color: var(--acc); background: var(--panel2); }
.ricon { font-size: 44px; }
.hint { margin-top: 34px; color: var(--tx2); font-size: 13.5px; max-width: 460px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px; max-width: 900px; margin: 0 auto; }

/* ---------- waiter: tables ---------- */
.tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 14px; }
.tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  padding: 18px 10px 14px; text-align: center; display: flex; flex-direction: column;
  gap: 8px; align-items: center; min-height: 128px; justify-content: center; }
.tcard:active { border-color: var(--acc); }
.tnum { font-size: 34px; font-weight: 800; }
.tcard.st-ready { border-color: var(--ready); box-shadow: 0 0 0 1px var(--ready) inset; }
.tcard.st-sent { border-color: var(--sent); }
.tcard.st-preparing { border-color: var(--prep); }
.tstat { font-size: 12.5px; font-weight: 700; color: var(--tx2); }

/* ---------- waiter: menu / table screen ---------- */
.twocol { display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 1280px;
  margin: 0 auto; padding: 14px; }
@media (min-width: 1050px) { .twocol { grid-template-columns: 420px 1fr; align-items: start; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px; }
.panel h3 { margin: 0 0 10px; font-size: 16px; }
.searchrow { display: flex; gap: 8px; margin-bottom: 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
.chips .btn { white-space: nowrap; min-height: 40px; }
.chips .btn.on { background: var(--acc2); border-color: transparent; }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px; }
.mitem { position: relative; text-align: left; background: var(--panel2);
  border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-height: 84px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
.mitem:active { border-color: var(--acc); }
.mimage { width: 100%; height: 100px; object-fit: cover; border-radius: 9px; }
.admin-image { display: block; max-width: 180px; max-height: 120px; object-fit: cover; border-radius: 10px; }
.admin-menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
.admin-menu-tile { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.admin-menu-photo { position: relative; display: grid; place-items: center; width: 100%; aspect-ratio: 1 / 1; padding: 0; overflow: hidden;
  border: 0; border-radius: 0; background: linear-gradient(145deg, var(--panel2), #233657); color: var(--tx2); font-size: 42px; }
.admin-menu-photo img { width: 100%; height: 100%; object-fit: cover; }
.admin-open-label { position: absolute; left: 8px; bottom: 8px; padding: 4px 8px; border-radius: 999px;
  background: rgba(5, 12, 26, .82); color: #fff; font-size: 11px; font-weight: 700; }
.admin-menu-info[onclick] { cursor: pointer; }
.admin-menu-info { padding: 9px 10px 5px; }
.admin-menu-name { min-height: 2.6em; font-weight: 750; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.admin-menu-meta { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-top: 6px; color: var(--tx2); font-size: 11px; }
.admin-menu-meta b { color: var(--acc); font-size: 14px; white-space: nowrap; }
.admin-menu-actions { display: flex; flex-wrap: wrap; gap: 5px; padding: 5px 8px 9px; }
.admin-menu-actions .btn { flex: 1 1 auto; min-width: 0; padding: 6px 8px; font-size: 11px; }
.chartbar { display: inline-block; min-width: 2px; height: 14px; background: var(--acc); border-radius: 8px; }
.mname { font-weight: 700; font-size: 15px; }
.mdesc { color: var(--tx2); font-size: 12.5px; }
.mprice { color: var(--acc); font-weight: 800; }
.mqty { position: absolute; top: -8px; right: -6px; background: var(--ready); color: #06220f;
  font-weight: 800; border-radius: 999px; min-width: 26px; height: 26px; display: flex;
  align-items: center; justify-content: center; font-size: 14px; padding: 0 6px; }
.cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--acc2);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 18px; font-weight: 800; font-size: 16.5px; box-shadow: 0 -6px 24px rgba(0,0,0,.5); }
.cartbar button { background: rgba(255,255,255,.18); padding: 10px 18px; border-radius: 12px;
  font-weight: 800; font-size: 16px; }
.ticket { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 12px 14px; margin-bottom: 12px; }
.ticket.st-ready { border-color: var(--ready); }
.ticket.st-cancelled { opacity: .55; }
.ticket.st-served { opacity: .6; }
.thead { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 8px; flex-wrap: wrap; }
.thead .tid { font-weight: 800; }
.tlines { margin: 4px 0 8px; }
.tline { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0;
  font-size: 15px; align-items: baseline; }
.tline .lnote { color: #fca5a5; font-size: 13px; }
.tline.cancelled { text-decoration: line-through; color: var(--tx2); }
.tacts { display: flex; gap: 8px; flex-wrap: wrap; }
.tnote { color: #fbbf24; font-size: 13.5px; margin: 2px 0 6px; }

/* ---------- kitchen ---------- */
.kds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 14px;
  max-width: 1600px; margin: 0 auto; align-items: start; }
@media (max-width: 900px) { .kds { grid-template-columns: 1fr; } }
.kcol { background: #0d1526; border: 1px solid var(--line); border-radius: 16px; padding: 10px;
  min-height: 200px; }
.kcol h2 { margin: 4px 6px 10px; font-size: 16px; text-transform: uppercase; letter-spacing: .08em;
  display: flex; justify-content: space-between; align-items: center; }
.kcol.c-new h2 { color: var(--sent); } .kcol.c-prep h2 { color: var(--prep); }
.kcol.c-ready h2 { color: var(--ready); }
.kcard { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--served);
  border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; }
.kcard.st-sent { border-left-color: var(--sent); }
.kcard.st-preparing { border-left-color: var(--prep); }
.kcard.st-ready { border-left-color: var(--ready); }
.khead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  margin-bottom: 6px; }
.ktable { font-size: 20px; font-weight: 800; }
.kage { font-weight: 800; color: var(--tx2); font-size: 14px; }
.kage.warn { color: var(--sent); } .kage.late { color: var(--cancel); }
.kline { display: flex; align-items: baseline; gap: 8px; padding: 7px 8px; border-radius: 10px;
  background: var(--panel2); margin-bottom: 6px; font-size: 15.5px; cursor: pointer; }
.kline .kq { font-weight: 800; }
.kline .lnote { color: #fca5a5; font-size: 13px; }
.kline.cancelled { text-decoration: line-through; opacity: .5; }
.kline.l-ready { background: #14532d; } .kline.l-preparing { background: #3b2a68; }
.kline .lx { margin-left: auto; color: var(--tx2); font-size: 15px; padding: 2px 8px; }
.knote { color: #fbbf24; font-size: 13.5px; margin: 2px 0 6px; }
.kbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* ---------- admin ---------- */
.tabs { display: flex; gap: 6px; padding: 10px 14px 0; max-width: 1280px; margin: 0 auto;
  overflow-x: auto; }
.tabs .btn.on { background: var(--acc2); border-color: transparent; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; flex-wrap: wrap; }
.row .grow { flex: 1; min-width: 140px; }
.row .rname { font-weight: 700; font-size: 16px; }
.row .rsub { color: var(--tx2); font-size: 13px; }
.tag { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  background: var(--panel2); border: 1px solid var(--line); color: var(--tx2); }
.tag.on { color: #86efac; border-color: #14532d; }
.tag.off { color: #fca5a5; border-color: #7f1d1d; }

/* ---------- dialog / pin pad ---------- */
dialog { border: none; background: transparent; padding: 0; max-width: 94vw; }
dialog::backdrop { background: rgba(2,6,16,.66); }
.dlg-box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  padding: 18px; width: min(560px, 92vw); max-height: 86vh; overflow: auto; }
.dlg-box h2 { margin: 0 0 12px; font-size: 18px; }
.error-text { color: #fca5a5; min-height: 1.3em; margin: 6px 0 0; }
.dlg-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 280px;
  margin: 12px auto 0; }
.pinpad button { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px;
  font-size: 24px; font-weight: 700; padding: 14px 0; }
.pindots { display: flex; gap: 12px; justify-content: center; margin-top: 6px; }
.pindots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--tx2); }
.pindots span.f { background: var(--acc); border-color: var(--acc); }

/* ---------- misc ---------- */
.empty { color: var(--tx2); text-align: center; padding: 26px 10px; }
.loading { color: var(--tx2); text-align: center; padding: 60px 16px; font-size: 17px; }
.fabrow { display: flex; justify-content: flex-end; margin-bottom: 12px; }

/* ---------- catalog admin editor ---------- */
.catalog-editor { display: grid; grid-template-columns: 180px 220px minmax(320px, 1fr); gap: 10px; align-items: start; }
.catalog-pane { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-width: 0; }
.catalog-pane h3 { margin: 0 0 8px; }
.catalog-pane-item { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between;
  gap: 8px; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.catalog-pane-item.on { background: var(--panel2); border-radius: 8px; }
.catalog-product-editor { max-height: calc(100vh - 210px); overflow: auto; }
.catalog-subhead { margin-top: 16px; }
.catalog-variant-row { display: grid; grid-template-columns: 1.3fr 0.8fr 0.8fr 44px 44px; gap: 6px; align-items: center; margin-bottom: 7px; }
.catalog-variant-row .in { padding: 8px; }
.catalog-groups { display: grid; gap: 8px; }
.catalog-group-option { display: grid; grid-template-columns: 22px 1fr 70px 70px; gap: 6px; align-items: center;
  border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.catalog-group-option .in { padding: 7px; }
@media (max-width: 900px) {
  .catalog-editor { grid-template-columns: 130px 160px minmax(300px, 1fr); overflow-x: auto; }
}
@media (max-width: 620px) {
  .catalog-editor { grid-template-columns: 1fr; }
  .catalog-product-editor { max-height: none; }
  .catalog-variant-row { grid-template-columns: 1fr 1fr; }
  .catalog-variant-row .catalog-v-default { grid-column: 1; }
  .catalog-group-option { grid-template-columns: 22px 1fr; }
  .catalog-group-option .in { width: 100%; }
}
  .catalog-variant-picker, .catalog-option-picker { display: grid; gap: 7px; }
  .catalog-choice { display:flex; align-items:center; gap:8px; min-height:44px; padding:9px 10px;
    border:1px solid var(--line); border-radius:10px; background:var(--panel2); }
  .catalog-choice.disabled { opacity:.55; }
  .catalog-choice .grow { flex:1; }
  .catalog-qty { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .catalog-sheet-price { margin-left:auto; color:var(--acc); font-weight:800; }
.bigprice { font-size: 18px; font-weight: 800; color: var(--acc); }
</style>
</head>
<body>
<div id="connbar" class="connbar hidden">⚠ Offline — orders are saved on this device and will send automatically</div>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
'use strict';
/* ============================================================
   Restaurant ordering app — core: state, api, offline queue, poll
   ============================================================ */

// ---------- tiny helpers ----------
function $(s) { return document.querySelector(s); }
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function money(v) { return Number(v || 0).toFixed(2) + ' ' + (S.data && S.data.currency ? S.data.currency : 'MAD'); }
function hhmm(ts) {
  var d = new Date(ts * 1000);
  var dd = ('0' + d.getDate()).slice(-2);
  var mm = ('0' + (d.getMonth() + 1)).slice(-2);
  var yyyy = d.getFullYear();
  var hh = ('0' + d.getHours()).slice(-2);
  var mi = ('0' + d.getMinutes()).slice(-2);
  return dd + '/' + mm + '/' + yyyy + ' ' + hh + ':' + mi;
}
function ageMin(ts) { return Math.max(0, Math.round((Date.now() / 1000 - S.skew - ts) / 60)); }
function ageLabel(ts) {
  var m = ageMin(ts), h = Math.floor(m / 60), r = m % 60;
  if (S.lang === 'fr') return m < 60 ? m + ' min' : h + ' h ' + r + ' min';
  if (S.lang === 'ar') return m < 60 ? m + ' د' : h + ' س ' + r + ' د';
  return m < 60 ? m + 'm' : h + 'h' + r + 'm';
}
function ageClass(ts) {
  var m = ageMin(ts);
  var amber = Number(S.data && S.data.settings && S.data.settings.ticket_amber_minutes != null
    ? S.data.settings.ticket_amber_minutes : 5);
  var red = Number(S.data && S.data.settings && S.data.settings.ticket_red_minutes != null
    ? S.data.settings.ticket_red_minutes : 10);
  return m >= red ? 'late' : (m >= amber ? 'warn' : '');
}
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function openOrders(list) {
  return (list || []).filter(function (o) {
    return o.status === 'sent' || o.status === 'preparing' || o.status === 'ready';
  });
}
function parseTables(staffTables) {
  try { var a = JSON.parse(staffTables || '[]'); return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}

// ---------- persistent state ----------
var S = {
  role: null, waiterId: null, data: null, rev: -1, skew: 0, online: true,
  branchId: 1,
  tableNo: null, search: '', sectionFilter: 0, adminTab: 'sections',
  adminItemFilter: 0, adminSearch: '', cart: {}, queue: [], seen: {}, pollT: null,
  adminPin: null, lang: 'fr',
  catalogProducts: [], catalogGroups: [], catalogLoadedFor: null, adminProductId: null,
  waiterCatalogLoadedFor: null, waiterProducts: [], waiterGroups: {},
  kitchenStation: null, kitchenStationFilter: null
};

var I18N = {
  fr: {
    offline: 'Hors ligne - les commandes sont sauvegardées sur cet appareil et seront envoyées au retour de la connexion.',
    waitOnline: 'action(s) de commande en attente - envoi automatique au retour de la connexion',
    language: 'Langue', pageTitle: 'Commandes du restaurant',
    roleHintMore: 'Utilisez une tablette par poste : les serveurs prennent les commandes, la cuisine reçoit les tickets en temps réel et l’administration gère le menu, le personnel et les paramètres.',
    waiterRole: 'Serveur', kitchenRole: 'Cuisine', adminRole: 'Administration',
    whoUses: 'Qui utilise cette tablette ?', roleHint: 'Le choix est mémorisé sur cet appareil.',
    roles: 'Rôles', waiterSignin: 'Connexion du serveur', myTables: 'Mes tables', home: 'Accueil', viewSectionItems: 'Voir les articles',
    table: 'Table', free: 'Libre', ready: 'Prêt - à servir !', orderSent: 'Commande envoyée',
    cooking: 'En préparation', noTables: 'Aucune table ne vous est attribuée.',
    noWaiters: 'Aucun serveur pour le moment.',
    noOpen: 'Aucun ticket ouvert pour cette table.', tickets: 'Tickets',
    all: 'Tout', menu: 'Menu', searchMenu: 'Rechercher dans le menu...', noDishes: 'Aucun plat trouvé.',
    review: 'Voir la commande', reviewOrder: 'Vérifier la commande', keepEditing: 'Continuer les modifications',
    sendKitchen: 'Envoyer en cuisine', print: 'Imprimer', served: 'Servi', cancel: 'Annuler',

// ---------- api + offline queue ----------
async function api(path, method, body, branchId) {
  var headers = { 'Content-Type': 'application/json', 'X-Branch-ID': String(branchId || S.branchId || 1) };
  if (S.role) headers['X-Actor-Role'] = String(S.role);
  if (S.waiterId != null) headers['X-Actor-ID'] = String(S.waiterId);
  if (S.adminPin) headers['X-Admin-Pin'] = S.adminPin;
  var res = await fetch(path, {
    method: method || 'GET', headers: headers,
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  var j = null;
  try { j = await res.json(); } catch (e) { j = { ok: false, error: 'Bad response from server' }; }
  if (!res.ok || j.ok === false) {
    var err = new Error(j.error || ('HTTP ' + res.status));
    err.code = res.status; throw err;
  }
  return j;
}
function branchControl() {
  var branches = S.data && S.data.branches ? S.data.branches : [];

    branches.map(function (b) {

        esc(b.name) + '</option>';
    }).join('') + '</select>';

function changeBranch(value) {
  var next = parseInt(value, 10);
  if (!next || next === S.branchId) return;
  S.branchId = next;
  saveLS('ro_branch', next);
  S.waiterId = null; S.tableNo = null; S.cart = {};
  S.catalogLoadedFor = null; S.catalogProducts = []; S.catalogGroups = [];
  S.waiterCatalogLoadedFor = null; S.waiterProducts = []; S.waiterGroups = {};
  sessionStorage.removeItem('ro_waiter'); saveLS('ro_cart', {});
  S.rev = -1; poll();
  if (S.role === 'admin' && S.adminTab === 'sales') loadSales(S.salesPeriod || '7d');
}
function enqueue(path, body) {
  S.queue.push({ path: path, body: body, branchId: S.branchId });

// Queue only carries order-critical, idempotent mutations (create order /
// status changes). A server-side rejection (bad request) is dropped so the
// queue never spins forever; a network error keeps items queued.
async function flushQueue() {
  if (!S.queue.length || !navigator.onLine) { renderConn(); return; }
  while (S.queue.length) {
    var item = S.queue[0];
    try {
      await api(item.path, 'POST', item.body, item.branchId);
      S.queue.shift(); saveLS('ro_queue', S.queue);
    } catch (e) {
      if (e.code) { S.queue.shift(); saveLS('ro_queue', S.queue); toast(tr('rejected') + e.message); }
      else break;
    }
  }
  renderConn();
  if (S.role) poll();
}

// ---------- polling ----------
async function poll() {
  try {
    var j = await api('/api/state');
    var wasOnline = S.online;
    S.online = true; S.data = j;
    S.skew = j.now - Date.now() / 1000;
    if (S.role === 'kitchen') detectNewOrders(j);
    var changed = j.rev !== S.rev;
    S.rev = j.rev;
    if (changed && S.role) render();
    if (!wasOnline) { toast(tr('backOnline')); flushQueue(); }
    renderConn();
  } catch (e) {
    S.online = false;
    renderConn();
  }
}

  if (sseSource) { sseSource.close(); sseSource = null; }
  if (!window.EventSource) { startPollFallback(); return; }
  sseSource = new EventSource('/api/events');
  sseSource.onmessage = function(e) {
    try {
      var d = JSON.parse(e.data);
      if (d.rev !== undefined && d.rev !== S.rev) poll();
    } catch(err) {}
  };
  sseSource.onerror = function() {
    sseSource.close(); sseSource = null;
    setTimeout(startSSE, 2000);
  };
}
function startPollFallback() {

}

  (j.orders || []).forEach(function (o) {

  });

function beep() {
  try {
    var ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    [880, 1175].forEach(function (f, i) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = 'sine';
      o.connect(g); g.connect(ctx.destination);
      var t = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);

    });
  } catch (e) {}
}

    : '<span class="tb-title">' + tr('myTables') + '</span><span class="tb-sub">' + esc(localizedLabel(S.data.restaurant)) + '</span>';
  return '<div class="topbar"><div class="tb-left">' + left + '</div><div class="tb-right">' + right + '</div></div>';
}
function switchWaiter() { S.waiterId = null; sessionStorage.removeItem('ro_waiter'); S.tableNo = null; render(); }
function backToTables() { S.tableNo = null; render(); }

function renderWaiterHome(app, me) {
  var tables = parseTables(me.tables);
  var orders = S.data.orders || [];
  var cards = tables.map(function (tableNo) {
    var open = openOrders(orders.filter(function (o) { return o.table_no === tableNo; }));
    var st = null, label = tr('free');
    if (open.some(function (o) { return o.status === 'ready'; })) { st = 'ready'; label = tr('ready'); }
    else if (open.some(function (o) { return o.status === 'sent'; })) { st = 'sent'; label = tr('orderSent'); }
    else if (open.some(function (o) { return o.status === 'preparing'; })) { st = 'preparing'; label = tr('cooking'); }
    return '<button class="tcard st-' + (st || 'free') + '" onclick="openTable(' + tableNo + ')">' +
      '<span class="tnum">' + tableNo + '</span><span class="tstat">' + label + '</span>' +
      (open.length ? '<span class="tag">' + open.length + ' ' + tr(open.length === 1 ? 'ticketCount' : 'ticketPlural') + '</span>' : '') +
      '</button>';
  }).join('');
  app.innerHTML = waiterHeader(me, false) +
    '<div class="pad">' +
    (cards ? '<div class="tables-grid">' + cards + '</div>'
           : '<div class="empty">' + tr('noTables') + '</div>') +
    '</div>';
}
function openTable(t) { S.tableNo = t; S.sectionFilter = 0; S.search = ''; render(); }

'use strict';
/* ============================================================
   Waiter: table screen — tickets, menu, cart, sending orders
   ============================================================ */

function cartFor(t) {
  if (!S.cart[t]) S.cart[t] = [];
  return S.cart[t];
}
function cartSave() { saveLS('ro_cart', S.cart); }
function cartCount(t) { return cartFor(t).reduce(function (n, l) { return n + l.qty; }, 0); }
function cartTotal(t) {
  return cartFor(t).reduce(function (n, l) {
    return n + catalogLinePrice(l) * l.qty;
  }, 0);
}
function findItem(id) {
  return (S.data.items || []).filter(function (i) { return i.id === id; })[0] || null;
}
function lineModifiers(raw) {
  if (Array.isArray(raw)) return raw;
  try { var parsed = JSON.parse(raw || '[]'); return Array.isArray(parsed) ? parsed : []; }
  catch (e) { return []; }
}

async function loadWaiterCatalog() {
  if (S.waiterCatalogLoadedFor === S.branchId) return;
  var products = await api('/api/products');
  var groups = await api('/api/modifier-groups');
  S.waiterProducts = products.products || [];
  S.waiterGroups = {};
  (groups.modifier_groups || []).forEach(function (g) { S.waiterGroups[g.id] = g; });
  S.waiterCatalogLoadedFor = S.branchId;
}

function findCatalogProduct(id) {
  return (S.waiterProducts || []).filter(function (p) { return p.id === id; })[0] || null;
}

function catalogLineVariant(line) {
  var product = findCatalogProduct(line.product_id);
  if (!product) return null;
  return (product.variants || []).filter(function (v) { return v.id === line.variant_id; })[0] || null;
}

function catalogLinePrice(line) {
  var variant = catalogLineVariant(line);
  if (!variant) return 0;
  var cents = variant.price_cents || 0;
  (line.modifier_option_ids || []).forEach(function (optionId) {
    Object.keys(S.waiterGroups || {}).forEach(function (groupId) {
      var option = ((S.waiterGroups[groupId].options) || []).filter(function (o) {
        return o.id === optionId;
      })[0];
      if (option) cents += option.price_delta_cents || 0;
    });
  });
  return cents / 100;
}

function renderTableScreen(app, me) {
  if (S.waiterCatalogLoadedFor !== S.branchId) {
    loadWaiterCatalog().then(function () { render(); }).catch(function (e) {
      toast(e.message || tr('needConnection'));
    });
  }
  var tableNo = S.tableNo;
  var orders = (S.data.orders || []).filter(function (o) { return o.table_no === tableNo; });
  var open = openOrders(orders);
  var recent = orders.filter(function (o) { return openOrders([o]).length === 0; }).slice(0, 3);

  var tickets = open.map(function (o) { return ticketCard(o, true); }).join('') ||
    '<div class="empty">' + tr('noOpen') + '</div>';
  var history = recent.map(function (o) { return ticketCard(o, false); }).join('');

  var sections = (S.data.sections || []).filter(function (s) { return s.active; });
  var chipAll = '<button class="btn small ' + (S.sectionFilter === 0 ? 'on' : '') +
    '" onclick="setSectionFilter(0)">' + tr('all') + '</button>';
  var chips = chipAll + sections.map(function (s) {
    return '<button class="btn small ' + (S.sectionFilter === s.id ? 'on' : '') +
      '" onclick="setSectionFilter(' + s.id + ')">' + esc(localizedLabel(s.name)) + '</button>';
  }).join('');

  var q = S.search.trim().toLowerCase();
  var items = (S.waiterProducts || []).filter(function (p) {
    if (!p.active || p.deleted_at) return false;
    if (S.sectionFilter && p.section_id !== S.sectionFilter) return false;
    if (q && (localizedLabel(p.name) + ' ' + p.name + ' ' + (p.description || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  var cart = cartFor(tableNo);
  var qtyOf = {}; cart.forEach(function (l) { qtyOf[l.product_id] = (qtyOf[l.product_id] || 0) + l.qty; });
  var grid = items.map(function (p) {
    var variants = (p.variants || []).filter(function (v) { return v.active; });
    var allSoldOut = variants.length > 0 && variants.every(function (v) { return v.stock_qty === 0; });
    var prices = variants.map(function (v) { return v.price_cents || 0; });
    var minPrice = prices.length ? Math.min.apply(Math, prices) : 0;
    var maxPrice = prices.length ? Math.max.apply(Math, prices) : 0;
    var priceLabel = minPrice === maxPrice ? money(minPrice / 100) :
      (I18N[S.lang].from || 'From') + ' ' + money(minPrice / 100);
    return '<button class="mitem"' + (allSoldOut ? ' disabled' : '') + ' onclick="chooseCatalogProduct(' + p.id + ')">' +
      (qtyOf[p.id] ? '<span class="mqty">' + qtyOf[p.id] + '</span>' : '') +
      (p.image_path ? '<img class="mimage" src="' + esc(p.image_path) + '" alt="">' : '') +
      '<span class="mname">' + esc(localizedLabel(p.name)) + '</span>' +
      (p.description ? '<span class="mdesc">' + esc(p.description) + '</span>' : '') +
      (allSoldOut ? '<span class="tag off">' + tr('outOfStock') + '</span>' : '') +
      '<span class="mprice">' + priceLabel + '</span></button>';
  }).join('');

  var cnt = cartCount(tableNo), tot = cartTotal(tableNo);
  var cartbar = cnt
    ? '<div class="cartbar"><span>🛒 ' + cnt + ' ' + tr(cnt === 1 ? 'itemSingular' : 'itemsPlural') + ' · ' + money(tot) +
      '</span><button onclick="openReview()">' + tr('review') + ' ▸</button></div>'
    : '';

  app.innerHTML = waiterHeader(me, true) +
    '<div class="twocol">' +
      '<div class="panel"><h3>' + tr('tickets') + '</h3>' + tickets + history + '</div>' +
      '<div><div class="panel">' +
        '<h3>' + tr('menu') + '</h3>' +
        '<div class="searchrow"><input id="f-wsearch" class="in" placeholder="' + tr('searchMenu') + '" ' +
          'value="' + esc(S.search) + '" oninput="setSearch(this.value)"></div>' +
        '<div class="chips">' + chips + '</div>' +
        '<div class="menu-grid">' + (grid || '<div class="empty">' + tr('noDishes') + '</div>') + '</div>' +
      '</div></div>' +
    '</div>' + cartbar;
}
function setSearch(v) { S.search = v; render(); }
function setSectionFilter(id) { S.sectionFilter = id; render(); }

function chooseCatalogProduct(productId) {
  var product = findCatalogProduct(productId);
  if (!product) return;
  var variants = (product.variants || []).filter(function (v) { return v.active; });
  var defaultVariant = variants.filter(function (v) { return v.is_default; })[0] || variants[0];
  if (!variants.length) return;
  var attachments = product.modifier_groups || [];
  var html = '<h2>' + esc(localizedLabel(product.name)) + '</h2>';
  if (product.description) html += '<p class="dim">' + esc(product.description) + '</p>';
  html += '<h3>Size / variant</h3><div class="catalog-variant-picker">';
  html += variants.map(function (v) {
    var soldOut = v.stock_qty === 0;
    return '<label class="catalog-choice' + (soldOut ? ' disabled' : '') + '">' +
      '<input type="radio" name="catalog-variant" value="' + v.id + '"' +
      (soldOut ? ' disabled' : '') + (v.id === defaultVariant.id ? ' checked' : '') + '>' +
      '<span class="grow">' + esc(v.name) + (soldOut ? ' — sold out' : '') + '</span>' +
      '<b>' + money(v.price_cents / 100) + '</b></label>';
  }).join('');
  html += '</div>';
  attachments.forEach(function (attachment) {
    var group = S.waiterGroups[attachment.modifier_group_id];
    if (!group) return;
    var minimum = attachment.override_min != null ? attachment.override_min : group.min_select;
    var maximum = attachment.override_max != null ? attachment.override_max : group.max_select;
    html += '<h3>' + esc(group.name) +
      (minimum > 0 ? ' * (choose ' + minimum + ')' : '') + '</h3><div class="catalog-option-picker">';
    (group.options || []).filter(function (o) { return o.active; }).forEach(function (o) {
      html += '<label class="catalog-choice"><input type="' +
        (group.selection_type === 'single' ? 'radio' : 'checkbox') +
        '" name="catalog-group-' + group.id + '" value="' + o.id +
        '" data-group="' + group.id + '" data-max="' + maximum +
        '" onchange="catalogSheetChanged(' + productId + ')"><span class="grow">' +
        esc(o.name) + '</span><b>' + ((o.price_delta_cents || 0) >= 0 ? '+' : '') +
        money((o.price_delta_cents || 0) / 100) + '</b></label>';
    });
    html += '</div>';
  });
  html += '<label class="f">Note</label><input id="catalog-sheet-note" class="in" maxlength="200">' +
    '<div class="catalog-qty"><button class="btn small" onclick="catalogQty(-1)">−</button>' +
    '<b id="catalog-sheet-qty">1</b><button class="btn small" onclick="catalogQty(1)">＋</button>' +
    '<span id="catalog-sheet-price" class="catalog-sheet-price"></span></div>' +
    '<div id="catalog-sheet-error" class="error-text"></div>' +
    '<div class="dlg-foot"><button class="btn" onclick="closeDlg()">' + tr('cancel') +
    '</button><button id="catalog-sheet-add" class="btn primary" onclick="confirmCatalogProduct(' +
    productId + ')">' + tr('addItem') + '</button></div>';
  dlg(html);
  catalogSheetChanged(productId);
}

function catalogQty(delta) {
  var el = document.getElementById('catalog-sheet-qty');
  if (!el) return;
  var qty = Math.max(1, Math.min(50, (parseInt(el.textContent, 10) || 1) + delta));
  el.textContent = qty;
  var productId = Array.prototype.map.call(document.querySelectorAll('[onclick^="confirmCatalogProduct"]'), function (b) {
    return null;
  });
  var addButton = document.getElementById('catalog-sheet-add');
  var match = addButton && addButton.getAttribute('onclick').match(/confirmCatalogProduct\((\d+)\)/);
  if (match) catalogSheetChanged(parseInt(match[1], 10));
}

function catalogSheetChanged(productId) {
  var product = findCatalogProduct(productId);
  if (!product) return;
  var selectedVariant = document.querySelector('input[name="catalog-variant"]:checked');
  var variant = selectedVariant ? (product.variants || []).filter(function (v) {
    return v.id === parseInt(selectedVariant.value, 10);
  })[0] : null;
  var cents = variant ? variant.price_cents || 0 : 0;
  var selectedIds = [];
  Array.prototype.forEach.call(document.querySelectorAll('.catalog-option-picker input:checked'), function (input) {
    selectedIds.push(parseInt(input.value, 10));
  });
  (product.modifier_groups || []).forEach(function (attachment) {
    var group = S.waiterGroups[attachment.modifier_group_id];
    if (!group) return;
    var maximum = attachment.override_max != null ? attachment.override_max : group.max_select;
    var checked = document.querySelectorAll('.catalog-option-picker input[data-group="' +
      group.id + '"]:checked');
    if (group.selection_type === 'multi' && checked.length >= maximum) {
      document.querySelectorAll('.catalog-option-picker input[data-group="' +
        group.id + '"]:not(:checked)').forEach(function (input) { input.disabled = true; });
    } else {
      document.querySelectorAll('.catalog-option-picker input[data-group="' +
        group.id + '"]').forEach(function (input) { input.disabled = false; });
    }
  });
  Object.keys(S.waiterGroups).forEach(function (groupId) {
    var group = S.waiterGroups[groupId];
    (group.options || []).forEach(function (option) {
      if (selectedIds.indexOf(option.id) >= 0) cents += option.price_delta_cents || 0;
    });
  });
  var qty = parseInt(document.getElementById('catalog-sheet-qty').textContent, 10) || 1;
  var priceEl = document.getElementById('catalog-sheet-price');
  if (priceEl) priceEl.textContent = money(Math.max(0, cents) / 100) + ' × ' + qty;
  var error = '';
  (product.modifier_groups || []).forEach(function (attachment) {
    var group = S.waiterGroups[attachment.modifier_group_id];
    if (!group) return;
    var minimum = attachment.override_min != null ? attachment.override_min : group.min_select;
    var selectedCount = document.querySelectorAll('.catalog-option-picker input[data-group="' +
      group.id + '"]:checked').length;
    if (minimum > 0 && selectedCount < minimum) error = 'Choose ' + minimum + ' option(s) from ' + group.name;
  });
  var errorEl = document.getElementById('catalog-sheet-error');
  if (errorEl) errorEl.textContent = error;
  var add = document.getElementById('catalog-sheet-add');
  if (add) add.disabled = !!error;
}

function confirmCatalogProduct(productId) {
  var product = findCatalogProduct(productId);
  if (!product) return;
  var selectedVariant = document.querySelector('input[name="catalog-variant"]:checked');
  if (!selectedVariant) { catalogInlineError('Select a variant'); return; }
  var optionIds = Array.prototype.map.call(
    document.querySelectorAll('.catalog-option-picker input:checked'),
    function (input) { return parseInt(input.value, 10); });
  var qty = parseInt(document.getElementById('catalog-sheet-qty').textContent, 10) || 1;
  var note = val('catalog-sheet-note');
  var cart = cartFor(S.tableNo);
  var key = JSON.stringify({
    product_id: productId,
    variant_id: parseInt(selectedVariant.value, 10),
    modifier_option_ids: optionIds.slice().sort(function (a, b) { return a - b; }),
    note: note
  });
  var line = cart.filter(function (l) {
    return JSON.stringify({
      product_id: l.product_id,
      variant_id: l.variant_id,
      modifier_option_ids: (l.modifier_option_ids || []).slice().sort(function (a, b) { return a - b; }),
      note: l.note || ''
    }) === key;
  })[0];
  if (line) line.qty += qty;
  else cart.push({
    product_id: productId,
    variant_id: parseInt(selectedVariant.value, 10),
    modifier_option_ids: optionIds,
    qty: qty,
    note: note
  });
  cartSave();
  closeDlg();
  render();
}

function ticketCard(o, actions) {
  var lines = o.lines.map(function (l) {
    var modifiers = lineModifiers(l.modifiers);
    var modifierNames = modifiers.map(function (m) { return m.name; }).join(', ');
    return '<div class="tline' + (l.status === 'cancelled' ? ' cancelled' : '') + '">' +
      '<span>' + l.qty + '× ' + esc(localizedLabel(l.name)) +
      (l.variant_name ? ' <span class="lnote">(' + esc(l.variant_name) + ')</span>' : '') +
      (modifiers.length ? '<span class="lnote"> · ' + esc(modifierNames) + '</span>' : '') +
      (l.note ? ' <span class="lnote">— ' + esc(l.note) + '</span>' : '') + '</span>' +
      '<span class="dim">' + (l.status === 'cancelled' ? tr('cancelled') : money(l.price * l.qty)) + '</span></div>';
  }).join('');
  var acts = '<div class="tacts"><button class="btn small" onclick="printTicket(' + o.id + ')">🖨️ ' +
    tr('print') + '</button>';
  if (actions) {
    acts +=
      (!o.bill_requested && o.status !== 'cancelled'
        ? '<button class="btn small" onclick="requestBill(' + o.id + ')">' + tr('requestBill') + '</button>' : '') +
      (o.status === 'ready' ? '<button class="btn small green" onclick="serveOrder(' + o.id + ')">✓ ' + tr('served') + '</button>' : '') +
      '<button class="btn small danger" onclick="cancelOrderDlg(' + o.id + ')">✕ ' + tr('cancel') + '</button>';
  }
  acts += '</div>';
  return '<div class="ticket st-' + o.status + '">' +
    '<div class="thead"><span class="tid">' + tr('ticket') + ' #' + o.id + ' · ' + hhmm(o.created_at) + '</span>' +
    '<span class="chip ' + o.status + '">' + tStatus(o.status) + '</span></div>' +
    '<div class="tlines">' + lines + '</div>' +
    (o.note ? '<div class="tnote">' + tr('notePrefix') + esc(o.note) + '</div>' : '') +
    '<div class="thead"><span class="bigprice">' + money(o.total) + '</span></div>' +
    acts + '</div>';
}
async function requestBill(id) {
  try { await api('/api/orders/' + id + '/bill', 'PUT', {}); poll(); }
  catch (e) { toast(e.code ? e.message : tr('needConnection')); }
}

// ---------- review + send ----------
function openReview() {
  var t = S.tableNo, cart = cartFor(t);
  if (!cart.length) return;
  var rows = cart.map(function (l, idx) {
    var product = findCatalogProduct(l.product_id);
    if (!product) return '';
    var variant = catalogLineVariant(l);
    var modifierNames = [];
    (l.modifier_option_ids || []).forEach(function (optionId) {
      Object.keys(S.waiterGroups || {}).forEach(function (groupId) {
        var option = ((S.waiterGroups[groupId].options) || []).filter(function (o) {
          return o.id === optionId;
        })[0];
        if (option) modifierNames.push(option.name);
      });
    });
    return '<div class="row">' +
      '<span class="grow"><span class="rname">' + esc(localizedLabel(product.name)) +
      (variant ? ' (' + esc(variant.name) + ')' : '') + '</span>' +
      '<span class="rsub">' + money(catalogLinePrice(l)) +
      (modifierNames.length ? ' · ' + esc(modifierNames.join(', ')) : '') +
      (l.note ? ' · <b style="color:#fca5a5">' + esc(l.note) + '</b>' : '') + '</span></span>' +
      '<button class="btn small" onclick="cartQty(' + idx + ',-1)">−</button>' +
      '<b>' + l.qty + '</b>' +
      '<button class="btn small" onclick="cartQty(' + idx + ',1)">＋</button>' +
      '<button class="btn small" onclick="cartNote(' + idx + ')">✎ ' + tr('noteLabel') + '</button>' +
      '</div>';
  }).join('');
  dlg('<h2>' + tr('table') + ' ' + t + ' — ' + tr('reviewOrder') + '</h2>' +
    '<div class="rows">' + rows + '</div>' +
    '<label class="f">' + tr('noteKitchen') + '</label>' +
    '<textarea id="f-onote" class="in" rows="2" placeholder="' + tr('optional') + '"></textarea>' +
    '<div class="dlg-foot">' +
    '<button class="btn" onclick="closeDlg()">' + tr('keepEditing') + '</button>' +
    '<button class="btn primary" onclick="sendOrder()">' + tr('send') + ' ▸</button></div>');
}
function cartQty(idx, d) {
  var cart = cartFor(S.tableNo);
  cart[idx].qty += d;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  cartSave();
  if (!cart.length) { closeDlg(); render(); } else { closeDlg(); openReview(); render(); }
}
function cartNote(idx) {
  var cart = cartFor(S.tableNo);
  dlg('<h2>' + tr('noteItem') + '</h2>' +
    '<input id="f-line-note" class="in" value="' + esc(cart[idx].note) + '" placeholder="' + tr('itemNotePlaceholder') + '">' +
    '<div class="dlg-foot"><button class="btn" onclick="closeDlg()">' + tr('back') + '</button>' +
    '<button class="btn primary" onclick="saveLineNote(' + idx + ')">' + tr('save') + '</button></div>');
}
function saveLineNote(idx) {
  var v = document.getElementById('f-line-note').value.trim().slice(0, 200);
  cartFor(S.tableNo)[idx].note = v;
  closeDlg(); openReview();
}
async function sendOrder() {
  var t = S.tableNo, cart = cartFor(t).slice();
  var noteEl = document.getElementById('f-onote');
  var note = noteEl ? noteEl.value.trim().slice(0, 300) : '';
  if (!cart.length) return;
  var body = {
    table_no: t, staff_id: S.waiterId, note: note, client_uuid: uuid(), lang: S.lang,
    lines: cart.map(function (l) {
      return {
        product_id: l.product_id,
        variant_id: l.variant_id,
        modifier_option_ids: l.modifier_option_ids || [],
        qty: l.qty,
        note: l.note || ''
      };
    })
  };
  S.cart[t] = []; cartSave();
  try {
    var r = await api('/api/orders', 'POST', body);
    closeDlg(); poll(); render();
    toast(tr('ticket') + ' #' + r.order_id + ' ' + tr('ticketSent'));
  } catch (e) {
    if (e.code) { // server refused (e.g. empty order) — restore cart
      S.cart[t] = cart; cartSave(); closeDlg(); toast(tr('sendFailed') + e.message);
    } else {
      enqueue('/api/orders', body);
      closeDlg(); poll(); render();
      toast(tr('offlineSavedOrder'));
    }
  }
}

// ---------- ticket actions ----------
function printTicket(id) { window.open('/api/ticket/' + id + '.html?lang=' + encodeURIComponent(S.lang), '_blank'); }
function serveOrder(id) {
  actOrQueue('/api/orders/' + id + '/status', { status: 'served' }, tr('ticket') + ' #' + id + ' ' + tr('ticketServed'));
}
async function cancelOrderDlg(id, isAdmin) {
  dlg('<h2>' + tr('cancelTicketTitle') + id + tr('questionSuffix') + '</h2>' +
    '<label class="f">' + tr('cancelReason') + '</label>' +
    '<input id="f-cancel-reason" class="in" placeholder="' + tr('cancelReasonPlaceholder') + '">' +
    '<div class="dlg-foot"><button class="btn" onclick="closeDlg()">' + tr('keepTicket') + '</button>' +
    '<button class="btn danger" onclick="confirmCancel(' + id + ')">' + tr('cancelTicket') + '</button></div>');
}
async function confirmCancel(id) {
  var el = document.getElementById('f-cancel-reason');
  var reason = el ? el.value.trim().slice(0, 300) : '';
  closeDlg();
  actOrQueue('/api/orders/' + id + '/status', { status: 'cancelled', reason: reason }, tr('ticket') + ' #' + id + ' ' + tr('cancelled'));
}
async function cancelLineDlg(orderId, lineId) {
  var o = (S.data.orders || []).filter(function (x) { return x.id === orderId; })[0];
  var l = o ? o.lines.filter(function (x) { return x.id === lineId; })[0] : null;
  dlg('<h2>' + tr('cancel') + ' «' + esc(l ? l.name : tr('item')) + '»' + tr('questionSuffix') + '</h2>' +
    '<div class="dlg-foot"><button class="btn" onclick="closeDlg()">' + tr('keepItem') + '</button>' +
    '<button class="btn danger" onclick="confirmLineCancel(' + orderId + ',' + lineId + ')">' + tr('cancelItem') + '</button></div>');
}
async function confirmLineCancel(orderId, lineId) {
  closeDlg();
  actOrQueue('/api/orders/' + orderId + '/lines/' + lineId + '/status', { status: 'cancelled' }, tr('item') + ' ' + tr('cancelled'));
}
async function actOrQueue(path, body, okMsg) {
  try {
    await api(path, 'POST', body);
    toast(okMsg); poll();
  } catch (e) {
    if (e.code) toast(tr('actionFailed') + e.message);
    else { enqueue(path, body); toast(tr('offlineSavedAction')); }
  }
}

'use strict';
/* ============================================================
   Kitchen display (KDS) + Admin area
   ============================================================ */

// ================= KITCHEN =================
function renderKitchen(app) {
  var orders = (S.data.orders || []).map(function(o) {
    if (!S.kitchenStation) return o;
    var copy = Object.assign({}, o);
    copy.lines = (o.lines || []).filter(function(l){return l.kitchen_station === S.kitchenStation;});
    var active = copy.lines.filter(function(l){return l.status !== 'cancelled';});
    if (!active.length) return null;
    copy.status = active.every(function(l){return l.status === 'ready' || l.status === 'served';}) ? 'ready' :
      (active.some(function(l){return l.status === 'preparing';}) ? 'preparing' : 'sent');
    return copy;
  }).filter(Boolean);
  var cols = [
    { cls: 'c-new',  title: '🆕 ' + tr('new'),     st: 'sent' },
    { cls: 'c-prep', title: '🔥 ' + tr('cooking'), st: 'preparing' },
    { cls: 'c-ready', title: '✅ ' + tr('ready'),  st: 'ready' }
  ];
  var html = cols.map(function (c) {
    var list = orders.filter(function (o) { return o.status === c.st; })
      .sort(function (a, b) { return a.created_at - b.created_at; });
    return '<div class="kcol ' + c.cls + '"><h2><span>' + c.title + '</span><span class="tag">' +
      list.length + '</span></h2>' +
      (list.map(kCard).join('') || '<div class="empty">' + tr('nothingHere') + '</div>') + '</div>';
  }).join('');
  app.innerHTML =
    '<div class="topbar"><div class="tb-left"><span class="tb-title">👨‍🍳 ' + tr('kitchenRole') + '</span>' +
      '<span class="tb-sub">' + esc(localizedLabel(S.data.restaurant)) + '</span></div>' +
      '<div class="tb-right">' + branchControl() + langControl() + '<button class="btn small" onclick="goHome()">⌂ ' + tr('home') + '</button>' + connDot() + '</div></div>' +
    '<div class="kds">' + html + '</div>';
}
function leaveRole() { goHome(); }

function kCard(o) {
  var lines = o.lines.map(function (l) {
    var modifiers = lineModifiers(l.modifiers);
    var tap = l.status === 'sent' || l.status === 'preparing';
    var cls = 'kline' + (l.status === 'cancelled' ? ' cancelled' : ' l-' + l.status);
    return '<div class="' + cls + '"' + (tap ? ' onclick="lineNext(' + o.id + ',' + l.id + ')"' : '') + '>' +
      '<span class="kq">' + l.qty + '×</span><span>' + esc(localizedLabel(l.name)) + '</span>' +
      (modifiers.length ? '<span class="lnote">+ ' + esc(modifiers.map(function (m) { return m.name; }).join(', ')) + '</span>' : '') +
      (l.note ? '<span class="lnote">· ' + esc(l.note) + '</span>' : '') +
      '<span class="chip ' + l.status + '">' + (l.status === 'cancelled' ? '86' : tStatus(l.status)) + '</span>' +
      (l.status !== 'cancelled' && o.status !== 'served'
        ? '<button class="lx" title="' + tr('outOfStock') + '" onclick="event.stopPropagation();cancelLineDlg(' + o.id + ',' + l.id + ')">✕</button>'
        : '') +
      '</div>';
  }).join('');
  var btns = '<div class="kbtns">';
  if (!S.kitchenStation && o.status === 'sent') btns += '<button class="btn small violet" onclick="startOrder(' + o.id + ')">▶ ' + tr('startCooking') + '</button>';
  if (!S.kitchenStation && (o.status === 'sent' || o.status === 'preparing')) btns += '<button class="btn small green" onclick="allReady(' + o.id + ')">✓ ' + tr('allReady') + '</button>';
  btns += '<button class="btn small" onclick="printTicket(' + o.id + ')">🖨️ ' + tr('print') + '</button>';
  if (o.status !== 'served') btns += '<button class="btn small danger" onclick="cancelOrderDlg(' + o.id + ')">✕ ' + tr('cancel') + '</button>';
  btns += '</div>';
  return '<div class="kcard st-' + o.status + '">' +
    '<div class="khead"><span class="ktable">' + tr('table') + ' ' + o.table_no + '</span>' +
    '<span class="dim">' + esc(o.staff_name || '') + '</span>' +
    '<span class="kage ' + ageClass(o.created_at) + '">' + ageLabel(o.created_at) + '</span></div>' +
    lines +
    (o.note ? '<div class="knote">' + tr('notePrefix') + esc(o.note) + '</div>' : '') +
    btns + '</div>';
}
function startOrder(id) { actOrQueue('/api/orders/' + id + '/status', { status: 'preparing' }, tr('cookingStarted')); }
function allReady(id) { actOrQueue('/api/orders/' + id + '/status', { status: 'ready' }, tr('orderReady')); }
async function lineNext(orderId, lineId) {
  var o = (S.data.orders || []).filter(function (x) { return x.id === orderId; })[0];
  if (!o) return;
  var l = o.lines.filter(function (x) { return x.id === lineId; })[0];
  if (!l) return;
  var next = l.status === 'sent' ? 'preparing' : (l.status === 'preparing' ? 'ready' : null);
  if (!next) { toast(tr('alreadyReady')); return; }
  actOrQueue('/api/orders/' + orderId + '/lines/' + lineId + '/status', { status: next },
    next === 'ready' ? tr('itemReady') : tr('itemCooking'));
}

// ================= ADMIN =================
function renderAdmin(app) {
  if (!S.adminPin) { renderAdminGate(app); return; }
  var tabs = [
    ['sections', '🗂 ' + tr('sections')], ['items', '🍽 ' + tr('menuTab')], ['waiters', '🧑‍🤝‍🧑 ' + tr('waiters')],
    ['orders', '🧾 ' + tr('orders')], ['reservations', '🗓 ' + tr('reservations')],
    ['sales', '📈 ' + tr('sales')], ['branches', '🏢 ' + tr('branch')], ['settings', '⚙️ ' + tr('settings')]
  ];
  var tabBtns = tabs.map(function (t) {
    return '<button class="btn small ' + (S.adminTab === t[0] ? 'on' : '') +
      '" onclick="setTab(\'' + t[0] + '\')">' + t[1] + '</button>';
  }).join('');
  var body = '';
  if (S.adminTab === 'sections') body = adminSections();
  else if (S.adminTab === 'items') body = adminItems();
  else if (S.adminTab === 'waiters') body = adminWaiters();
  else if (S.adminTab === 'orders') body = adminOrders();
  else if (S.adminTab === 'reservations') body = adminReservations();
  else if (S.adminTab === 'sales') body = adminAnalytics();
  else if (S.adminTab === 'branches') body = adminBranches();
  else body = adminSettings();
  app.innerHTML =
    '<div class="topbar"><div class="tb-left"><span class="tb-title">⚙️ ' + tr('admin') + '</span>' +
      '<span class="tb-sub">' + esc(localizedLabel(S.data.restaurant)) + '</span></div>' +
      '<div class="tb-right">' + branchControl() + langControl() + '<button class="btn small" onclick="goHome()">⌂ ' + tr('home') + '</button>' + connDot() + '</div></div>' +
    '<div class="tabs">' + tabBtns + '</div>' +
    '<div class="pad">' + body + '</div>';
}
function setTab(t) {
  S.adminTab = t; S.adminSearch = ''; render();
  if (t === 'items') loadCatalogEditor();
  if (t === 'sales') loadSales('7d');
}

// ---- PIN gate ----
var pinBuf = '';
function renderAdminGate(app) {
  app.innerHTML =
    '<div class="topbar"><div class="tb-left"><span class="tb-title">⚙️ ' + tr('admin') + '</span></div>' +
      '<div class="tb-right">' + langControl() + '<button class="btn small" onclick="leaveRole()">' + tr('roles') + '</button>' + connDot() + '</div></div>' +
    '<div class="role-wrap"><div class="brand">' + tr('restricted') + '</div><h1>' + tr('enterPin') + '</h1>' +
    '<div class="pindots" id="pindots"></div>' +
    '<div class="pinpad">' +
      [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button onclick="pinKey(' + n + ')">' + n + '</button>'; }).join('') +
      '<button onclick="pinClear()">' + tr('clear') + '</button><button onclick="pinKey(0)">0</button><button onclick="pinBack()">⌫</button>' +
    '</div>' +
    '<button class="btn primary" style="margin-top:16px;min-width:220px" onclick="tryPin()">' + tr('unlock') + ' ✓</button>' +
    '<div class="hint">' + tr('defaultPin') + '</div></div>';
  drawPinDots();
}
function drawPinDots() {
  var el = document.getElementById('pindots');
  if (!el) return;
  el.innerHTML = [0, 1, 2, 3].map(function (i) {
    return '<span class="' + (i < pinBuf.length ? 'f' : '') + '"></span>';
  }).join('');
}
function pinKey(n) { if (pinBuf.length < 8) { pinBuf += n; drawPinDots(); } }
function pinBack() { pinBuf = pinBuf.slice(0, -1); drawPinDots(); }
function pinClear() { pinBuf = ''; drawPinDots(); }
async function tryPin() {
  if (!pinBuf) { toast(tr('enterPinToast')); return; }
  S.adminPin = pinBuf;
  try {
    await api('/api/export');           // harmless request that validates the PIN
    sessionStorage.setItem('ro_adminpin', pinBuf);
    pinBuf = ''; toast(tr('adminUnlocked')); render();
  } catch (e) {
    S.adminPin = null; pinBuf = '';
    toast(e.code === 403 ? tr('wrongPin') : (tr('serverUnavailable') + e.message));
    drawPinDots();
  }
}

// ---- form helpers ----
function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }
function chk(id) { var e = document.getElementById(id); return !!(e && e.checked); }

// ---- sections tab ----
function adminSections() {
  var secs = (S.data.sections || []).slice().sort(function (a, b) { return a.position - b.position || a.id - b.id; });
  var rows = secs.map(function (s) {
    var sectionItems = (S.data.items || []).filter(function (i) { return i.section_id === s.id; });
    var n = sectionItems.length;
    var cover = sectionItems.filter(function (i) { return i.image_url; })[0];
    return '<article class="admin-menu-tile">' +
      '<button class="admin-menu-photo" onclick="showSectionItems(' + s.id + ')" aria-label="Open ' + esc(localizedLabel(s.name)) + ' items">' +
        (cover ? '<img src="' + esc(cover.image_url) + '" alt="' + esc(localizedLabel(s.name)) + '">' : '<span aria-hidden="true">🗂️</span>') +
        '<span class="admin-open-label">' + tr('viewSectionItems') + ' →</span>' +
      '</button>' +
      '<div class="admin-menu-info" onclick="showSectionItems(' + s.id + ')"><div class="admin-menu-name">' + esc(localizedLabel(s.name)) + '</div>' +
        '<div class="admin-menu-meta"><span>' + n + ' ' + (n === 1 ? tr('itemSingular') : tr('itemsPlural')) + '</span>' +
          '<span class="tag ' + (s.active ? 'on' : 'off') + '">' + (s.active ? tr('active') : tr('hidden')) + '</span></div>' +
        '<div class="admin-menu-meta"><span>' + (s.kitchen_station ? '🍳 ' + esc(s.kitchen_station) : 'Unassigned') + '</span></div>' +
      '</div><div class="admin-menu-actions">' +
        '<button class="btn small" aria-label="Move up" onclick="moveSection(' + s.id + ',-1)">↑</button>' +
        '<button class="btn small" aria-label="Move down" onclick="moveSection(' + s.id + ',1)">↓</button>' +
        '<button class="btn small" onclick="event.stopPropagation();sectionDlg(' + s.id + ')">✎ ' + tr('editSection') + '</button>' +
        '<button class="btn small danger" onclick="event.stopPropagation();deleteSection(' + s.id + ')">🗑</button>' +
      '</div></article>';
  }).join('');
  return '<div class="fabrow"><button class="btn primary" onclick="sectionDlg(0,0)">＋ ' + tr('newSection') + '</button></div>' +
    '<div class="admin-menu-grid">' + (rows || '<div class="empty">' + tr('noSections') + '</div>') + '</div>';
}
function showSectionItems(id) {
  S.adminItemFilter = id;
  S.adminSearch = '';
  S.adminTab = 'items';
  render();
}
async function sectionDlg(id) {
  var s = id ? (S.data.sections || []).filter(function (x) { return x.id === id; })[0] : { name: '' };
  dlg('<h2>' + (id ? tr('renameSection') : tr('newSection')) + '</h2>' +
    '<input id="f-s-name" class="in" value="' + esc(localizedLabel(s.name)) + '" placeholder="' + tr('sectionPlaceholder') + '">' +
    '<label class="f">Kitchen station</label><input id="f-s-station" class="in" value="' + esc(s.kitchen_station || '') + '" placeholder="Pizza, Chicken, Grill…">' +
    '<label class="f"><input type="checkbox" id="f-s-active"' + (s.active !== 0 ? ' checked' : '') + '> ' + tr('activeOnWaiter') + '</label>' +
    '<div class="dlg-foot"><button class="btn" onclick="closeDlg()">' + tr('cancel') + '</button>' +
    '<button class="btn primary" onclick="saveSection(' + (id || 0) + ')">' + tr('save') + '</button></div>');
  var el = document.getElementById('f-s-name'); if (el) el.focus();
}
async function saveSection(id) {
  var name = sourceLabel(val('f-s-name'));
  if (!name) { toast(tr('nameRequired')); return; }
  try {
    var body = { name: name, kitchen_station: val('f-s-station'), active: chk('f-s-active') ? 1 : 0 };
    if (id) await api('/api/sections/' + id, 'PUT', body);
    else await api('/api/sections', 'POST', body);
    closeDlg(); toast(tr('saved')); poll();
  } catch (e) { toast(e.code ? e.message : tr('needConnection')); }
}
async function moveSection(id, dir) {
  var secs = (S.data.sections || []).slice().sort(function (a, b) { return a.position - b.position || a.id - b.id; });
  var idx = -1;
  secs.forEach(function (s, i) { if (s.id === id) idx = i; });
  var j = idx + dir;
  if (idx < 0 || j < 0 || j >= secs.length) return;
  try {
    await api('/api/sections/' + secs[idx].id, 'PUT', { position: secs[j].position });
    await api('/api/sections/' + secs[j].id, 'PUT', { position: secs[idx].position });
    poll();
  } catch (e) { toast(e.code ? e.message : tr('needConnection')); }
}
function toggleSection(id, v) {
  api('/api/sections/' + id, 'PUT', { active: v })
    .then(function () { poll(); })
    .catch(function (e) { toast(e.code ? e.message : tr('needConnection')); });
}
function deleteSection(id) {
  var s = (S.data.sections || []).filter(function (x) { return x.id === id; })[0];
  var n = (S.data.items || []).filter(function (i) { return i.section_id === id; }).length;
  dlg('<h2>' + tr('deleteQuestion') + esc(s ? localizedLabel(s.name) : '') + tr('deleteSuffix') + '</h2>' +
    (n ? '<p class="dim">' + tr('hasItems') + n + tr('moveOrDelete') + '</p>' : '<p class="dim">' + tr('cannotUndo') + '</p>') +
    '<div class="dlg-foot"><button class="btn" onclick="closeDlg()">' + tr('keep') + '</button>' +
    '<button class="btn danger" onclick="doDeleteSection(' + id + ')">' + tr('delete') + '</button></div>');
}
async function doDeleteSection(id) {
  try { await api('/api/sections/' + id, 'DELETE'); closeDlg(); toast(tr('deleted')); poll(); }
  catch (e) { closeDlg(); toast(e.message); }
}

// ---- catalog items tab ----
async function loadCatalogEditor() {
  var key = S.branchId;
  if (S.catalogLoadedFor === key) return;
  try {
    var products = await api('/api/products');
    var groups = await api('/api/modifier-groups');
    S.catalogProducts = products.products || [];
    S.catalogGroups = groups.modifier_groups || [];
    S.catalogLoadedFor = key;
    render();
  } catch (e) {
    toast(e.message || tr('needConnection'));
  }
}

function sectionName(id) {
  var s = (S.data.sections || []).filter(function (x) { return x.id === id; })[0];
  return s ? localizedLabel(s.name) : '?';
}

function adminItems() {
  if (S.catalogLoadedFor !== S.branchId) {
    loadCatalogEditor();
    return '<div class="loading">' + tr('loading') + '</div>';
  }
  var q = S.adminSearch.trim().toLowerCase();
  var sections = (S.data.sections || []).slice().sort(function (a, b) {
    return (a.position || 0) - (b.position || 0) || a.id - b.id;
  });
  var filtered = S.catalogProducts.filter(function (p) {
    if (S.adminItemFilter && p.section_id !== S.adminItemFilter) return false;
    return !q || (localizedLabel(p.name) + ' ' + p.name).toLowerCase().indexOf(q) >= 0;
  });
  if (S.adminProductId && !S.catalogProducts.some(function (p) { return p.id === S.adminProductId; })) {
    S.adminProductId = null;
  }
  var sectionHtml = sections.map(function (s) {
    var count = S.catalogProducts.filter(function (p) {
      return p.section_id === s.id && p.deleted_at == null;
    }).length;
    return '<button class="catalog-pane-item ' + (S.adminItemFilter === s.id ? 'on' : '') +
      '" onclick="setCatalogSection(' + s.id + ')"><span>' + esc(localizedLabel(s.name)) + '</span><span class="tag">' + count + '</span></button>';
  }).join('');
  var productHtml = filtered.map(function (p) {
    var defaultVariant = (p.variants || []).filter(function (v) { return v.is_default; })[0] ||
      (p.variants || [])[0];
    return '<button class="catalog-pane-item ' + (S.adminProductId === p.id ? 'on' : '') +
      '" onclick="selectCatalogProduct(' + p.id + ')"><span>' +
      esc(localizedLabel(p.name)) + '</span><span class="dim">' +
      (defaultVariant ? money(defaultVariant.price_cents / 100) : '') + '</span></button>';
  }).join('');
  var product = S.catalogProducts.filter(function (p) { return p.id === S.adminProductId; })[0] || null;
  var editor = catalogProductEditor(product);
  return '<div class="searchrow"><input id="f-catalog-search" class="in" placeholder="' +
    tr('searchItems') + '" value="' + esc(S.adminSearch) +
    '" oninput="setAdminSearch(this.value)">' +
    '<button class="btn primary" onclick="selectCatalogProduct(0)">＋ ' + tr('newItem') + '</button></div>' +
    '<div class="catalog-editor"><aside class="catalog-pane catalog-sections"><h3>' +
    tr('sections') + '</h3><button class="catalog-pane-item ' + (!S.adminItemFilter ? 'on' : '') +
    '" onclick="setCatalogSection(0)"><span>' + tr('allSections') + '</span></button>' +
    sectionHtml + '</aside><aside class="catalog-pane catalog-products"><h3>' +
    tr('menuTab') + '</h3><div>' + (productHtml || '<div class="empty">' + tr('noItemsMatch') + '</div>') +
    '</div></aside><section class="catalog-pane catalog-product-editor">' +
    editor + '</section></div>';
}

function setCatalogSection(id) {
  S.adminItemFilter = parseInt(id) || 0;
  S.adminProductId = null;
  render();
}

function selectCatalogProduct(id) {
  S.adminProductId = id ? parseInt(id) : 0;
  render();
}

function setAdminSearch(v) { S.adminSearch = v; render(); }

function catalogVariantRows(product) {
  var variants = product ? (product.variants || []) : [{
    id: null, name: 'Regular', price_cents: 0, stock_qty: null,
    is_default: 1, sort_order: 0, active: 1
  }];
  return variants.map(function (v, index) {
    return '<div class="catalog-variant-row" data-variant-id="' + (v.id || '') + '">' +
      '<input class="in catalog-v-name" value="' + esc(v.name || '') + '" placeholder="Name">' +
      '<input class="in catalog-v-price" type="number" min="0" step="0.01" inputmode="decimal" value="' +
      ((v.price_cents || 0) / 100).toFixed(2) + '" placeholder="Price">' +
      '<input class="in catalog-v-stock" type="number" min="0" step="1" value="' +
      (v.stock_qty == null ? '' : v.stock_qty) + '" placeholder="Stock">' +
      '<label title="Default"><input class="catalog-v-default" type="radio" name="catalog-default"' +
      (v.is_default ? ' checked' : '') + '></label>' +
      '<button type="button" class="btn small danger" onclick="removeCatalogVariant(this)">×</button>' +
      '</div>';
  }).join('');
}

function catalogProductEditor(product) {
  if (S.adminProductId === 0 || (!S.adminProductId && !product)) {
    product = {
      id: null, section_id: S.adminItemFilter || (S.data.sections[0] || {}).id || 0,
      name: '', description: '', image_path: '', active: 1,
      variants: [{ id: null, name: 'Regular', price_cents: 0, stock_qty: null,
        is_default: 1, sort_order: 0, active: 1 }],
      modifier_groups: []
    };
  }
  if (!product) {
    return '<div class="empty">Select a product or create a new one.</div>';
  }
  var sectionOptions = (S.data.sections || []).map(function (s) {
    return '<option value="' + s.id + '"' + (product.section_id === s.id ? ' selected' : '') +
      '>' + esc(localizedLabel(s.name)) + '</option>';
  }).join('');
  var attached = {};
  (product.modifier_groups || []).forEach(function (g) {
    attached[g.modifier_group_id] = g;
  });
  var groupOptions = S.catalogGroups.map(function (g) {
    var attachment = attached[g.id];
    return '<label class="catalog-group-option"><input type="checkbox" value="' + g.id + '"' +
      (attachment ? ' checked' : '') + '> ' + esc(g.name) +
      '<span class="dim">' + (g.selection_type === 'single' ? 'choose 1' : 'up to ' + g.max_select) +
      '</span><input class="in catalog-group-min" data-group-id="' + g.id +
      '" type="number" min="0" value="' + (attachment && attachment.override_min != null ?
        attachment.override_min : g.min_select) + '" title="Min">' +
      '<input class="in catalog-group-max" data-group-id="' + g.id +
      '" type="number" min="0" value="' + (attachment && attachment.override_max != null ?
        attachment.override_max : g.max_select) + '" title="Max"></label>';
  }).join('');
  return '<h3>' + (product.id ? 'Edit product' : 'New product') + '</h3>' +
    '<div id="catalog-product-error" class="error-text"></div>' +
    '<label class="f">Name</label><input id="catalog-p-name" class="in" value="' +
    esc(localizedLabel(product.name || '')) + '">' +
    '<label class="f">Section</label><select id="catalog-p-section" class="in">' + sectionOptions + '</select>' +
    '<label class="f">Description</label><textarea id="catalog-p-description" class="in" rows="3">' +
    esc(product.description || '') + '</textarea>' +
    '<label class="f">Image</label>' + (product.image_path ?
      '<img class="admin-image" src="' + esc(product.image_path) + '" alt="">' : '') +
    '<input id="catalog-p-image" class="in" type="file" accept="image/png,image/jpeg,image/webp">' +
    '<label class="f"><input id="catalog-p-active" type="checkbox"' +
    (product.active ? ' checked' : '') + '> Active</label>' +
    '<h3 class="catalog-subhead">Variants</h3><div id="catalog-variants">' +
    catalogVariantRows(product) + '</div>' +
    '<button type="button" class="btn small" onclick="addCatalogVariant()">＋ Add variant</button>' +
    '<h3 class="catalog-subhead">Modifier groups</h3><div class="catalog-groups">' +
    (groupOptions || '<div class="dim">No modifier groups.</div>') + '</div>' +
    '<div class="dlg-foot">' +

async function saveCatalogProduct(id) {
  var name = val('catalog-p-name');
  if (!name) { catalogInlineError(tr('nameRequired')); return; }
  var rows = Array.prototype.slice.call(document.querySelectorAll('.catalog-variant-row'));
  if (!rows.length) { catalogInlineError('Product requires at least one variant'); return; }
  var defaults = 0;
  var names = {};
  var variants = rows.map(function (row) {
    var variantName = row.querySelector('.catalog-v-name').value.trim();
    var price = parseFloat(row.querySelector('.catalog-v-price').value);
    var stockText = row.querySelector('.catalog-v-stock').value;
    var isDefault = row.querySelector('.catalog-v-default').checked ? 1 : 0;
    defaults += isDefault;
    names[variantName] = (names[variantName] || 0) + 1;
    return {
      id: row.getAttribute('data-variant-id') ? parseInt(row.getAttribute('data-variant-id')) : null,
      name: variantName,
      price_cents: isFinite(price) ? Math.round(price * 100) : -1,
      stock_qty: stockText === '' ? null : parseInt(stockText, 10),
      is_default: isDefault,
      sort_order: rows.indexOf(row),
      active: 1
    };
  });
  if (defaults !== 1) { catalogInlineError('Exactly one default variant is required'); return; }
  if (variants.some(function (v) { return !v.name || v.price_cents < 0; })) {
    catalogInlineError('Variant names and non-negative prices are required');
    return;
  }
  if (Object.keys(names).some(function (n) { return !n || names[n] > 1; })) {
    catalogInlineError('Variant names must be unique');
    return;
  }
  var modifierGroups = [];
  document.querySelectorAll('.catalog-group-option input[type="checkbox"]:checked').forEach(function (box) {
    var groupId = parseInt(box.value, 10);
    var minInput = document.querySelector('.catalog-group-min[data-group-id="' + groupId + '"]');
    var maxInput = document.querySelector('.catalog-group-max[data-group-id="' + groupId + '"]');
    modifierGroups.push({
      modifier_group_id: groupId,
      override_min: minInput && minInput.value !== '' ? parseInt(minInput.value, 10) : null,
      override_max: maxInput && maxInput.value !== '' ? parseInt(maxInput.value, 10) : null,
      sort_order: modifierGroups.length
    });
  });
  var body = {
    name: sourceLabel(name),
    section_id: parseInt(val('catalog-p-section'), 10),
    description: val('catalog-p-description'),
    active: chk('catalog-p-active') ? 1 : 0,
    variants: variants,
    modifier_groups: modifierGroups
  };
  try {
    var productId = id;
    if (id) await api('/api/products/' + id, 'PATCH', body);
    else productId = (await api('/api/products', 'POST', body)).product_id;
    var file = document.getElementById('catalog-p-image').files[0];
    if (file) {
      if (file.size > 2000000) throw new Error('Image size must be at most 2 MB');
      var dataUrl = await new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () { resolve(reader.result); };
        reader.onerror = function () { reject(new Error('Could not read image')); };
        reader.readAsDataURL(file);
      });
      await api('/api/products/' + productId + '/image', 'PUT', {
        mime: file.type, data: String(dataUrl).split(',')[1]
      });
    }
    S.catalogLoadedFor = null;
    S.adminProductId = productId;
    await loadCatalogEditor();
    toast(tr('saved'));
  } catch (e) {
    catalogInlineError(e.code ? e.message : (e.message || tr('needConnection')));
  }
}

function waiterSaveError(message, fieldId) {
  var e = document.getElementById('f-w-error');
  if (e) e.textContent = message;

  if (field) field.focus();

function parseTablesText(str) {
  var out = [];
  String(str || '').split(',').forEach(function (part) {
    part = part.trim();
    if (!part) return;
    var chain = part.split(/\s*-\s*/);
    if (chain.length === 2 && chain.every(function (n) { return /^\d+$/.test(n); })) {
      var a = +chain[0], b = +chain[1], tmp;
      if (a > b) { tmp = a; a = b; b = tmp; }
      if (b - a <= 500) for (var i = a; i <= b; i++) out.push(i);
    } else if (chain.length > 2 && chain.every(function (n) { return /^\d+$/.test(n); })) {
      chain.forEach(function (n) { out.push(+n); });
    } else if (/^\d+$/.test(part)) out.push(+part);
  });
  var uniq = [];
  out.forEach(function (n) { if (uniq.indexOf(n) < 0) uniq.push(n); });
  return uniq.sort(function (x, y) { return x - y; });
}
function validTablesText(str) {
  if (!String(str || '').trim()) return true;
  return String(str).split(',').every(function(part) {
    part = part.trim();
    return /^(\d+)(\s*-\s*\d+)*$/.test(part);
  });
}
